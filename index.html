<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image Label Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #232f3e; }
        #preview { max-width: 100%; margin-top: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #labels { margin-top: 20px; }
        .label { background: white; padding: 10px 15px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #ff9900; display: flex; justify-content: space-between; }
        button { padding: 12px 24px; background: #ff9900; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-left: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { padding: 10px; }
    </style>
</head>
<body>
    <h1>Image Label Detector</h1>
    <p>Upload an image and AWS Rekognition will detect what's in it!</p>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadAndDetect()" id="detectBtn">Detect Labels</button>
    <img id="preview" style="display:none">
    <div id="labels"></div>
    <script>
        const BUCKET = 'rekognition-images-navneet';
        const REGION = 'us-east-1';
        const API_URL = 'https://x2g06tv2sf.execute-api.us-east-1.amazonaws.com/prod/detect';

        async function uploadAndDetect() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) { alert('Please select an image first'); return; }
            const btn = document.getElementById('detectBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            document.getElementById('labels').innerHTML = '';
            const key = `uploads/${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
            const uploadUrl = `https://${BUCKET}.s3.${REGION}.amazonaws.com/${key}`;
            try {
                const uploadRes = await fetch(uploadUrl, {
                    method: 'PUT',
                    body: file,
                    headers: { 'Content-Type': file.type }
                });
                if (!uploadRes.ok) throw new Error('Upload to S3 failed: ' + uploadRes.status);
                document.getElementById('preview').src = URL.createObjectURL(file);
                document.getElementById('preview').style.display = 'block';
                const detectRes = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageKey: key })
                });
                const data = await detectRes.json();
                if (data.error) throw new Error(data.error);
                const labelsDiv = document.getElementById('labels');
                if (data.labels && data.labels.length > 0) {
                    labelsDiv.innerHTML = '<h3>Detected Labels:</h3>' + 
                        data.labels.map(l => `<div class="label"><span>${l.name}</span><strong>${l.confidence}%</strong></div>`).join('');
                } else {
                    labelsDiv.innerHTML = '<p>No labels detected.</p>';
                }
            } catch (err) {
                alert('Error: ' + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Detect Labels';
            }
        }
    </script>
</body>
</html>
